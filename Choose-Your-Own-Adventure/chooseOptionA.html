<style>
        body {
          
            animation: subShake 0.15s infinite, redAlarmGlow 2s infinite; 
            overflow-x: hidden;
        }
        @keyframes subShake {
            0% { transform: translate(3px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -1px) rotate(-0.5deg); }
            40% { transform: translate(-4px, 0px) rotate(0.5deg); }
            60% { transform: translate(0px, 2px) rotate(0deg); }
            80% { transform: translate(2px, -1px) rotate(0.5deg); }
            100% { transform: translate(-2px, 2px) rotate(-0.5deg); }
        } 

        @keyframes redAlarmGlow {
            0% { background-color: hsl(0, 98%, 25%); }
            50% { background-color: #ff0000; }
            100% { background-color: lab(10.46% 12.53 11.81); }
        }

</style>
